# 릴리스가 끝나면 Homebrew tap(cozyuj/homebrew-tap)의 cask·formula 버전과 sha256 을 갱신해 푸시한다 (APP-17).
# - release 워크플로 성공 → 그 태그 버전으로. formula 는 npm 에 그 버전이 있을 때만 따라간다
# - npm publish 뒤 formula 를 맞추려면: gh workflow run homebrew.yml -f version=0.30.0
# 인증: tap 저장소의 쓰기 deploy key 를 이 저장소 secret HOMEBREW_TAP_DEPLOY_KEY 에 둔다. 없으면 경고만 내고 건너뛴다.
name: homebrew
on:
  workflow_run:
    workflows: [release]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: '버전 (예: 0.30.0). 비우면 package.json'
        required: false
jobs:
  tap:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-latest
    env:
      DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    steps:
      - name: 버전
        id: v
        env:
          INPUT: ${{ inputs.version }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${INPUT:-$TAG}"
          v="${v#v}"
          if [ -n "$v" ]; then
            # 잘못된 값(x.y.z, 아직 없는 버전)은 dmg 404 까지 가지 않고 여기서 이유와 함께 멈춘다 (APP-18)
            if ! [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::버전 형식이 아닙니다: '$v' — 숫자 x.y.z 로 넣으세요 (예: 0.29.5)"
              exit 1
            fi
            if ! gh release view "v$v" -R "${{ github.repository }}" >/dev/null 2>&1; then
              echo "::error::GitHub Release v$v 가 없습니다 — 태그를 푸시해 release 가 끝난 버전만 넣을 수 있습니다"
              exit 1
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "버전: ${v:-package.json}"
      - name: deploy key 확인
        id: key
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY 가 없어 tap 갱신을 건너뜁니다"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/checkout@v4
        if: steps.key.outputs.ok == 'true'
        with:
          repository: cozyuj/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: tap
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == 'true'
        with:
          node-version: 22
      - name: cask · formula 갱신
        if: steps.key.outputs.ok == 'true'
        run: |
          args=(--tap tap)
          [ -n "${{ steps.v.outputs.version }}" ] && args+=(--version "${{ steps.v.outputs.version }}")
          node scripts/update-homebrew.js "${args[@]}"
      - name: 커밋 · 푸시
        if: steps.key.outputs.ok == 'true'
        working-directory: tap
        run: |
          if git diff --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git diff --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "ai-office $(grep -m1 -o 'version "[^"]*"' Casks/ai-office.rb | cut -d'"' -f2)"
          git push
