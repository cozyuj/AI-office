# 태그 v* 를 푸시하면 맥(arm64)·Windows(x64) 앱을 빌드해 GitHub Release 에 올리고 updater 용 latest.json 을 만든다.
# 로컬: git tag v0.24.0 && git push origin v0.24.0
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            triple: aarch64-apple-darwin
            args: --target aarch64-apple-darwin --bundles app,dmg
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.triple }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Node 사이드카
        run: node scripts/fetch-node.js --target ${{ matrix.triple }}
      - name: 앱 의존성
        run: npm ci --prefix app
      - name: 테스트
        run: npm test
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: app
          tagName: ${{ github.ref_name }}
          releaseName: 'AI Office ${{ github.ref_name }}'
          releaseBody: |
            ## ⬇️ 다운로드
            - **맥 (Apple Silicon)**: `AI Office_<버전>_aarch64.dmg` — 응용 프로그램 폴더에 넣고 처음 한 번 **우클릭 → 열기** (코드 서명 없음). macOS 15 이상에서 안 열리면 시스템 설정 → 개인정보 보호 및 보안 → **그래도 열기**.
            - **Windows (x64)**: `AI Office_<버전>_x64-setup.exe` — SmartScreen 경고가 뜨면 "추가 정보 → 실행".
            - **그 외 / 웹 버전**: Node 18+ 에서 `npx claude-ai-office`
            
            설치된 앱은 새 버전이 나오면 스스로 받아 두고 메뉴바(트레이)에 ⬆ 를 표시합니다. 메뉴의 "업데이트 적용" 으로 다시 시작하면 반영됩니다.
            
            변경 내역: https://github.com/cozyuj/AI-office/pulls?q=is%3Apr+is%3Amerged
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
      # README 의 "항상 최신" 링크용: 버전 없는 고정 이름으로 한 벌 더 올린다 (releases/latest/download/<이름>)
      - name: 고정 이름 자산 올리기
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          B=app/src-tauri/target
          if [ "${{ runner.os }}" = "macOS" ]; then
            f=$(ls $B/${{ matrix.triple }}/release/bundle/dmg/*.dmg | head -1); cp "$f" AI-Office-mac-arm64.dmg
            gh release upload "${{ github.ref_name }}" AI-Office-mac-arm64.dmg --clobber -R "${{ github.repository }}"
          else
            f=$(ls $B/release/bundle/nsis/*-setup.exe | head -1); cp "$f" AI-Office-windows-x64-setup.exe
            gh release upload "${{ github.ref_name }}" AI-Office-windows-x64-setup.exe --clobber -R "${{ github.repository }}"
          fi

  # Windows 실기 대용: 올라간 설치 파일을 조용히 설치 → 앱 실행 → 서버 응답 · 훅 등록 · 훅 → 서버 경로 확인
  smoke-windows:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: 설치 파일 받기
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ github.ref_name }}" -R "${{ github.repository }}" -p 'AI-Office-windows-x64-setup.exe' -D dl
      - name: 설치 → 실행 → 확인
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Process (Resolve-Path dl\AI-Office-windows-x64-setup.exe) -ArgumentList '/S' -Wait
          $dir = Get-ChildItem $env:LOCALAPPDATA -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'node.exe') } | Select-Object -First 1
          if (-not $dir) { throw '설치 폴더(node.exe 포함)를 찾지 못함' }
          "설치 폴더: $($dir.FullName)"; Get-ChildItem $dir.FullName | Format-Table Name, Length
          $exe = Get-ChildItem $dir.FullName -Filter *.exe | Where-Object { $_.Name -notmatch '(?i)uninstall|^node\.exe$' } | Select-Object -First 1
          "실행: $($exe.Name)"
          Start-Process $exe.FullName
          $state = $null
          for ($i = 0; $i -lt 90; $i++) { try { $state = Invoke-RestMethod http://127.0.0.1:4777/api/state -TimeoutSec 2; break } catch { Start-Sleep 1 } }
          if (-not $state) { throw '서버가 90초 안에 응답하지 않음' }
          "서버 버전: $($state.version)"
          if ("v$($state.version)" -ne '${{ github.ref_name }}') { throw "서버 버전 $($state.version) 이 태그 ${{ github.ref_name }} 와 다름" }
          $settings = Join-Path $env:USERPROFILE '.claude\settings.json'
          if (-not (Test-Path $settings)) { throw '훅이 등록되지 않음 (settings.json 없음)' }
          $cfg = Get-Content $settings -Raw | ConvertFrom-Json
          $cmd = $cfg.hooks.SessionStart[0].hooks[0].command
          "훅 명령: $cmd"
          $parts = [regex]::Matches($cmd, '"([^"]+)"') | ForEach-Object { $_.Groups[1].Value }
          if (-not (Test-Path $parts[0])) { throw "훅 node 없음: $($parts[0])" }
          if (-not (Test-Path $parts[1])) { throw "훅 emit.js 없음: $($parts[1])" }
          $payload = '{"session_id":"ci-smoke","cwd":"C:\\ci-smoke","transcript_path":"","hook_event_name":"SessionStart","source":"startup"}'
          $payload | & $parts[0] $parts[1]
          Start-Sleep 2
          $after = Invoke-RestMethod http://127.0.0.1:4777/api/state
          if (-not ($after.sessions | Where-Object { $_.id -eq 'ci-smoke' })) { throw '훅 → 서버 경로 실패: ci-smoke 세션이 안 보임' }
          '훅 → 서버 OK'
          Stop-Process -Name $exe.BaseName -Force
          Start-Sleep 5
          try { Invoke-RestMethod http://127.0.0.1:4777/api/state -TimeoutSec 2 | Out-Null; throw '앱을 죽인 뒤에도 서버가 남아 있음' } catch { if ($_.Exception.Message -match '남아 있음') { throw } ; '앱 종료 후 서버도 종료 OK' }
