<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Office</title>
  <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
<div id="banner" class="banner hidden"></div>
<div id="app">
  <aside id="left" class="panel">
    <div class="panel-head">
      <span class="panel-title">층별 안내</span>
      <span class="panel-sub">FLOOR GUIDE</span>
    </div>
    <div id="floors" class="scroll"></div>
    <div class="panel-foot" id="left-foot"></div>
  </aside>

  <main id="center">
    <header id="office-head">
      <span id="head-badge" class="floor-badge">–</span>
      <div class="head-text">
        <div id="head-title" class="head-title">사무실</div>
        <div id="head-sub" class="head-sub">훅 이벤트를 기다리는 중</div>
      </div>
      <div class="head-tools seg">
        <button id="follow-btn" class="tool" title="선택한 세션의 Claude 를 카메라가 따라갑니다">📍 따라가기</button>
        <button id="bubbles-btn" class="tool" title="말풍선을 선택한 세션만 보일지 전체를 보일지">💬 말풍선: 전체</button>
        <button id="notify-btn" class="tool" title="Claude 가 질문하거나 허락을 기다리면 브라우저 알림을 보냅니다">🔔 알림</button>
        <button id="customize-btn" class="tool" title="나 / Claude / 서브에이전트 캐릭터 외형 고르기">👤 외형</button>
        <button id="demo-btn" class="tool" title="가짜 세션 4개로 사무실을 북적이게 (실제 세션과 별도 층, '(데모)' 표시)">🎬 데모</button>
        <button id="ambient-btn" class="tool" title="쉬는 캐릭터가 커피 마시러 가거나 서성이는 자율 행동">✨ 생동감</button>
        <button id="theme-btn" class="tool" title="다크 모드 전환">🌙</button>
      </div>
      <span id="live" class="live off"><i></i><b>OFFLINE</b></span>
    </header>
    <div id="stage">
      <canvas id="office"></canvas>
      <div id="stage-empty" class="stage-empty">
        <div class="stage-empty-title">아직 출근한 사람이 없습니다</div>
        <div class="stage-empty-sub">Claude Code 세션이 시작되면 여기에 나타납니다.</div>
        <div class="stage-empty-card">
          <div class="muted">훅을 아직 설치하지 않았다면</div>
          <div class="cmd"><code id="install-cmd">cd <span id="install-dir">ai-office</span> && npm run install-hooks</code><button id="copy-cmd" class="tool">복사</button></div>
          <div class="muted">미리 보려면 <code>npm run demo</code></div>
        </div>
      </div>
      <div id="zoom">
        <button id="zoom-in" title="확대">+</button>
        <button id="zoom-out" title="축소">−</button>
        <button id="zoom-reset" title="초기 위치">⟲</button>
      </div>
      <div id="stage-hint">드래그로 이동 · 휠로 확대 · 캐릭터를 클릭하면 세션 선택</div>
    </div>
  </main>

  <aside id="right" class="panel">
    <section class="card" id="session-card">
      <div class="kv"><span class="k">프로젝트</span><span class="v" id="info-project">–</span></div>
      <div class="kv"><span class="k">세션</span><span class="v mono" id="info-session">–</span></div>
    </section>

    <section class="card">
      <div class="card-head"><span>사무실 사람들</span><span class="muted" id="people-count"></span></div>
      <div id="people" class="list"></div>
    </section>

    <section class="card grow">
      <div class="card-head"><span>활동 로그</span><span class="muted" id="log-count"></span></div>
      <div class="log-tools">
        <input id="log-search" type="search" placeholder="검색 (내용·이름)" autocomplete="off">
        <button id="log-mine" class="tool" title="선택한 세션의 로그만">선택 세션만</button>
      </div>
      <div id="log" class="list scroll"></div>
    </section>

    <section class="card" id="legend-card">
      <div class="card-head" title="접기/펼치기"><span>어디서 무엇을 하나</span></div>
      <div id="legend" class="legend"></div>
    </section>
  </aside>
</div>
<div id="tooltip" class="tooltip hidden"></div>
<div id="customize" class="modal hidden">
  <div class="modal-card cz">
    <div class="modal-head"><span>캐릭터 외형</span><button class="tool" data-action="close">닫기</button></div>
    <div class="cz-body">
      <div class="cz-left">
        <div class="cz-targets"></div>
        <canvas class="cz-preview"></canvas>
        <div class="cz-actions">
          <button class="tool" data-action="random">🎲 랜덤</button>
          <button class="tool" data-action="reset">↺ 초기화</button>
          <button class="tool" data-action="delete" title="저장한 설정을 지우고 기본값으로">🗑 저장 삭제</button>
        </div>
      </div>
      <div class="cz-options"></div>
    </div>
    <div class="modal-foot"><span class="muted">저장은 이 브라우저에만 남습니다 (localStorage)</span><button class="tool on" data-action="save">저장</button></div>
  </div>
</div>
<script type="module" src="/js/main.js"></script>
</body>
</html>
